# k8s/backend-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-app
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: public.ecr.aws/docker/library/python:3.10-slim # Replace with your actual image later
        ports:
        - containerPort: 8000
        command: ["python", "-m", "http.server", "8000"] # Placeholder command for testing
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  ports:
    - name : http 
      protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP